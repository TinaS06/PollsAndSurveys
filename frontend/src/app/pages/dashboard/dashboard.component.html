<div class="container">
  <header class="app-header">
    <div class="brand" (click)="goHome()">Survey Master</div>
    <div class="nav">
      <div *ngIf="currentUser" class="small">{{ currentUser.username }}</div>
      <button class="btn btn-muted" (click)="logout()">Logout</button>
    </div>
  </header>

  <div style="display:flex;align-items:center;justify-content:space-between;margin:20px 0">
    <div>
      <h2 style="margin:0">My Dashboard</h2>
      <div class="small">Manage your surveys</div>
    </div>
    <div>
      <button class="btn btn-primary" (click)="createNewSurvey()">Create New Survey</button>
    </div>
  </div>

  <section>
    <h3 style="margin:14px 0">My Surveys</h3>
    <div *ngIf="mySurveys.length > 0" class="grid">
      <div *ngFor="let survey of mySurveys" class="card">
        <div class="meta">{{ getResponseCount(survey.id) }} responses • {{ survey.questions.length }} questions</div>
        <h4>{{ survey.title }}</h4>
        <p>{{ survey.description }}</p>
        <div class="actions" style="margin-top:12px">
          <button class="btn btn-ghost" (click)="editSurvey(survey.id)">Edit</button>
          <button class="btn btn-ghost" (click)="viewResults(survey.id)">Results</button>
          <button class="btn" style="background:transparent;color:var(--danger)" (click)="deleteSurvey(survey.id)">Delete</button>
        </div>
      </div>
    </div>

    <div *ngIf="mySurveys.length === 0" class="card" style="text-align:center">
      <p class="small">No surveys yet — create your first survey to get started.</p>
      <div style="margin-top:12px"><button class="btn btn-primary" (click)="createNewSurvey()">Create Survey</button></div>
    </div>
  </section>
</div>
